# 项目相关配置
jonlink:
  # 名称
  name: JonLink
  # 版本
  version: 3.9.2
  # 版权年份
  copyrightYear: 2026
  # 文件路径 示例（ Windows配置D:/jonlink/uploadPath，Linux配置 /home/jonlink/uploadPath）
  # [AUDIT-2026-09-04] 换 Linux 路径,真生产用 env UPLOAD_PATH 覆盖
  profile: ${UPLOAD_PATH:/opt/JonLink/uploadPath}
  # 获取ip地址开关
  addressEnabled: false
  # 验证码类型 math 数字计算 char 字符验证
  captchaType: math

# 开发环境配置
server:
  # 服务器的HTTP端口，默认为8080
  port: 8080
  servlet:
    # 应用的访问路径
    context-path: /
  tomcat:
    # tomcat的URI编码
    uri-encoding: UTF-8
    # 连接数满后的排队数，默认为100
    accept-count: 1000
    threads:
      # tomcat最大线程数，默认为200
      max: 800
      # Tomcat启动初始化的线程数，默认值10
      min-spare: 100

# 日志配置
logging:
  level:
    com.jonlink: debug
    org.springframework: warn

# 用户配置
user:
  password:
    # 密码最大错误次数
    maxRetryCount: 5
    # 密码锁定时间（默认10分钟）
    lockTime: 10

# Spring配置
spring:
  # 资源信息
  messages:
    # 国际化资源文件路径
    basename: i18n/messages
  profiles:
    active: druid
  # 文件上传
  servlet:
    multipart:
      # 单个文件大小
      max-file-size: 10MB
      # 设置总上传的文件大小
      max-request-size: 20MB
  jackson:
    time-zone: GMT+8
    date-format: yyyy-MM-dd HH:mm:ss
  # 服务模块
  devtools:
    restart:
      # 热部署开关
      enabled: true
  data:
    # redis 配置
    redis:
      # 地址
      host: localhost
      # 端口，默认为6379
      port: 6379
      # 数据库索引
      database: 0
      # 密码
      password:
      # 连接超时时间
      timeout: 10s
      lettuce:
        pool:
          # 连接池中的最小空闲连接
          min-idle: 0
          # 连接池中的最大空闲连接
          max-idle: 8
          # 连接池的最大数据库连接数
          max-active: 8
          # #连接池最大阻塞等待时间（使用负值表示没有限制）
          max-wait: -1ms

# token配置
token:
  # 令牌自定义标识
  header: Authorization
  # 令牌密钥
  secret: ${JWT_SECRET:YqV2c8TkP4nHbW7XmZ3eL6sJ9uR1vN5dA0gF8iD3oB2hC4kE6}
  # 令牌有效期（默认30分钟）
  expireTime: 30

# MyBatis配置
mybatis:
  # 搜索指定包别名
  typeAliasesPackage: com.jonlink.**.domain
  # 配置mapper的扫描，找到所有的mapper.xml映射文件
  mapperLocations: classpath*:mapper/**/*Mapper.xml
  # 加载全局的配置文件
  configLocation: classpath:mybatis/mybatis-config.xml

# PageHelper分页插件
pagehelper:
  helperDialect: mysql
  supportMethodsArguments: true
  params: count=countSql

# Springdoc配置
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    tags-sorter: alpha
  group-configs:
    - group: 'default'
      display-name: '测试模块'
      paths-to-match: '/**'
      packages-to-scan: com.jonlink.web.controller.tool

# 防盗链配置
referer:
  # 防盗链开关
  enabled: false
  # 允许的域名列表
  allowed-domains: localhost,127.0.0.1,jonlink.vip

# 防止XSS攻击
xss:
  # 过滤开关
  enabled: true
  # 排除链接（多个用逗号分隔）
  excludes: /system/notice
  # 匹配链接
  urlPatterns: /system/*,/monitor/*,/tool/*

# 公众号配置
wx:
  # AES 密钥(Base64,16/24/32 字节);真生产必须用环境变量 WX_AES_KEY 覆盖,默认值仅为本地占位
  aes:
    key: ${WX_AES_KEY:CRJcY+YUEO8qfQY8agmnqw==}
  # OAuth 回调基础地址(需配置为公网可访问的域名/IP, 生产环境建议使用 HTTPS 域名)
  oauth:
    callback-base: http://115.190.215.93/wx/oauth/callback
  # 回调验签配置
  callback:
    # 是否允许未配置 token 时 mock 放行(生产环境建议关闭)
    allow-mock: ${WX_CALLBACK_ALLOW_MOCK:false}

# 企业微信配置
wecom:
  # 企业ID
  corp-id: 
  # 应用AgentId
  agent-id: 
  # 应用Secret
  secret: 
  # 回调Token
  token: 
  # 回调AES密钥(43字节Base64)
  aes-key: 
  # 通讯录同步配置
  sync:
    # 是否开启自动同步（每日凌晨1点）
    enabled: false
  # 登录授权配置
  auth:
    # 是否启免登
    enabled: false
    # 授权后重定向地址
    redirect-uri: 
